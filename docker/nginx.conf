server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # A API fica na rede interna do Compose; o navegador só fala com este nginx (mesma origem: sem CORS).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # arquivos com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer outro caminho devolve o index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
