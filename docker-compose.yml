# Dois jeitos de usar:
#   docker compose up -d db          -> só o Postgres (desenvolvimento: npm run dev no seu computador)
#   docker compose up --build        -> tudo (banco + API + web) em http://localhost:8080
# Credenciais abaixo são só para a sua máquina; não use em produção.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crm:crm@db:5432/crm
      NODE_ENV: production
      PORT: '3000'
      # Em produção o cookie é Secure (só HTTPS). Aqui o acesso é http://localhost, então desligamos.
      COOKIE_SEGURO: 'false'
    # sem "ports": a API só é alcançada pelo nginx, dentro da rede do Compose
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  pgdata:
